version: "1.0"
eval_id: asmp4-semantic-selector-audit-v0-15
claim: A clause-complete conservative audit finds no canonical ASMP-4 clause that selects between the computed q-fiber sensor and the forced raw-mode-injective sensor; any ambiguous clause blocks the claim.
mode: pairwise
adapter: generic
candidates:
  - id: lexical_baseline
    model: deterministic-six-term-search
    model_family: exact-string-baseline
  - id: semantic_candidate
    model: deterministic-clause-audit
    model_family: conservative-formal-audit
dataset:
  path: semantic_clause_rows_v0_15.jsonl
  size: 23
  unit: canonical_clause
  held_out: false
  contamination_check: completed
  selection: Complete ASMP-4 section split into prose paragraphs, numbered obligations, and liveness bullets; formulas remain attached to their introducing clause.
scoring:
  deterministic:
    - canonical_source_hash_matches
    - all_source_units_covered_exactly_once
    - source_text_reconstructs_after_normalization
    - label_in_allowed_vocabulary
    - selector_rationale_present
    - ambiguous_or_selecting_clause_blocks_claim
    - output_schema_valid
    - task_completion
  subjective_dimensions: []
  subjective_only_justification: The target is a frozen-text clause audit with explicit conservative labels; no LLM preference judge is used.
pairwise:
  blind_identity: false
  swap_positions: false
  randomize_order: false
  random_seed: 1504
  allow_tie: true
  allow_uncertain: true
escalation:
  deterministic_conflict: block
  any_ambiguous_clause: adjudicate_and_block
  any_selecting_clause: reject_claim
decision_rule:
  primary_candidate: semantic_candidate
  baseline_candidate: lexical_baseline
  minimum_win_rate: 1.0
  confidence: 0.95
  reliability:
    max_hard_fail_selection_rate: 0.0
    min_deterministic_coverage: 1.0
data_contract:
  judgments: no_subjective_judgments.jsonl
  deterministic: deterministic_clause_checks_v0_15.jsonl
provenance:
  canonical_source_sha256: 08115cc4cb9c5333725a820ad3ca67909e15e8625aac3f128bde46b88ed161f5
  preregistered_before_clause_labels: true

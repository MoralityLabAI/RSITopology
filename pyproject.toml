[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-topology"
version = "0.1.0"
description = "Bounded spectral-bundle discovery over JSpace harmonic geometry"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
# Used by the repository's scripts and tests but not by the core package.
test = ["pytest", "hypothesis", "matplotlib", "sympy", "networkx", "psutil"]
# Model-bearing captures and replays (Qwen); not needed for the CPU controls.
model = ["torch", "transformers", "bitsandbytes", "safetensors"]

[tool.setuptools.packages.find]
include = ["rsi_topology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
